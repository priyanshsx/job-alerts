[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-alerts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-dotenv", "pyyaml", "pydantic", "httpx", "openai", "gspread", "google-auth", "openpyxl", "pandas"]

[project.optional-dependencies]
console = ["streamlit>=1.50"]

[tool.setuptools.packages.find]
include = ["job_alerts"]